services:
  api:
    build: .
    image: wind-forecast-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Absolute path inside the container; /app/data is the persistent volume.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
    volumes:
      - wind-data:/app/data
    restart: unless-stopped

  # Test suite in a throwaway container: docker compose --profile test run --rm tests
  tests:
    build: .
    profiles: ["test"]
    user: root
    working_dir: /app
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./requirements-dev.txt:/app/requirements-dev.txt:ro
    command: sh -c "pip install -q -r requirements-dev.txt && pytest -q"

volumes:
  wind-data:
